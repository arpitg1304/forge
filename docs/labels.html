<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataset facts — gallery</title>
<style>
  :root{
    --ink:#0b0b0b; --paper:#ffffff; --page:#f2f1ed; --muted:#6b6a66;
    --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);
       line-height:1.4;padding:40px 20px 80px}
  .wrap{max-width:1160px;margin:0 auto}

  /* Quiet header — the labels are the loud objects */
  .top{display:flex;justify-content:space-between;align-items:baseline;
       border-bottom:2.5px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
  h1{font-size:30px;font-weight:900;letter-spacing:-1px}
  .back{font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
  .back:hover{color:var(--muted);border-color:var(--muted)}
  .lede{font-size:13px;color:var(--muted);margin:10px 0 22px}
  .lede b{color:var(--ink);font-weight:700}

  /* Sort controls — text links, not pills */
  .sort{font-size:12.5px;color:var(--muted);margin-bottom:26px}
  .sort a{color:var(--ink);text-decoration:none;margin:0 2px;padding-bottom:1px;cursor:pointer}
  .sort a:hover{color:var(--muted)}
  .sort a.on{border-bottom:2px solid var(--ink)}

  /* Grid of labels at reduced scale — no card, no shadow, they float */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
        gap:34px 30px;align-items:start}
  .cell{cursor:pointer;background:none;border:none;padding:0;font:inherit;text-align:left;
        transition:transform .12s ease}
  .cell:hover{transform:translateY(-3px)}
  .cell svg{width:100%;height:auto;display:block}
  .cap{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:8px;
       display:flex;justify-content:space-between;gap:8px}
  .cap .id{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .empty{color:var(--muted);font-size:14px}

  /* Modal — full label on a dimmed backdrop */
  .modal[hidden]{display:none}
  .modal{position:fixed;inset:0;background:rgba(11,11,10,.55);
         display:flex;align-items:center;justify-content:center;padding:32px 16px;z-index:10}
  .sheet{max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
  .sheet .label-holder{width:360px;max-width:100%}
  .sheet .label-holder svg{width:100%;height:auto;display:block}
  .actions{width:360px;max-width:100%;display:flex;flex-direction:column;gap:10px}
  .btnrow{display:flex;gap:8px}
  .btn{flex:1;text-align:center;font-size:12.5px;font-family:var(--font);color:var(--ink);
       background:var(--paper);border:1px solid var(--ink);padding:8px 10px;text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .snip{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--paper);
        border:1px solid var(--ink);padding:8px 10px;overflow:auto;white-space:pre;cursor:text}
  .snip-label{font-size:10.5px;color:#e8e6e0;text-transform:lowercase;letter-spacing:.03em}
</style>
</head>

  <div class="sheet">
    <div class="label-holder" id="modalLabel"></div>
    <div class="actions">
      <div class="btnrow">
        <a class="btn" id="dlPng" download>Download PNG</a>
        <button class="btn" type="button" id="closeBtn">Close</button>
      </div>
      <div class="snip" id="snip" title="click to select"></div>
    </div>

<script>
(function(){
  var grid = document.getElementById('grid');
  var modal = document.getElementById('modal');
  var holder = document.getElementById('modalLabel');
  var dlPng = document.getElementById('dlPng');
  var snip = document.getElementById('snip');

  function openModal(cell){
    var svg = cell.querySelector('svg');
    holder.innerHTML = '';
    holder.appendChild(svg.cloneNode(true));
    var png = cell.getAttribute('data-png');
    var name = cell.getAttribute('data-name');
    dlPng.setAttribute('href', png);
    dlPng.setAttribute('download', cell.getAttribute('data-id') + '.png');
    snip.textContent = '![Dataset facts: ' + name + '](' + png + ')';
    modal.hidden = false;
  }
  function closeModal(){ modal.hidden = true; holder.innerHTML = ''; }

  if (grid) grid.addEventListener('click', function(ev){
    var cell = ev.target.closest('.cell');
    if (cell) openModal(cell);
  });
  modal.addEventListener('click', function(ev){ if (ev.target === modal) closeModal(); });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeModal(); });
  snip.addEventListener('click', function(){
    var r = document.createRange(); r.selectNodeContents(snip);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  });

  // Sorting — reorder .cell nodes by data attribute.
  var sortBar = document.getElementById('sort');
  if (sortBar && grid) sortBar.addEventListener('click', function(ev){
    var a = ev.target.closest('a[data-key]');
    if (!a) return;
    var key = a.getAttribute('data-key');
    var asc = (key === 'id');
    sortBar.querySelectorAll('a').forEach(function(x){ x.classList.remove('on'); });
    a.classList.add('on');
    var cells = Array.prototype.slice.call(grid.children);
    cells.sort(function(x, y){
      var xv = x.getAttribute('data-' + key), yv = y.getAttribute('data-' + key);
      if (!asc){ return parseFloat(yv) - parseFloat(xv); }
      return xv < yv ? -1 : xv > yv ? 1 : 0;
    });
    cells.forEach(function(c){ grid.appendChild(c); });
  });
})();
</script>
