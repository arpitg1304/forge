<defs>
<clipPath id="card"><rect width="1200" height="400" rx="16"/></clipPath>
<pattern id="gMin" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#101722" stroke-width="1"/></pattern>
<pattern id="gMaj" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gMin)"/><path d="M100 0H0V100" fill="none" stroke="#151e2b" stroke-width="1"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="55%" stop-color="#05070a" stop-opacity="0"/><stop offset="100%" stop-color="#05070a" stop-opacity="0.6"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.glow{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
.st rect{animation:st 9.0s infinite}.cell rect{animation:cell 9.0s infinite}
@keyframes st{0%,100%{stroke:#2a3647}3%,11%{stroke:#7aa2ff}16%{stroke:#2a3647}}
@keyframes cell{0%,4%{stroke:#2a3647;fill:#0f1520}8%,16%{stroke:#4cc9f0;fill:#0d1b26}26%,100%{stroke:#2a3647;fill:#0f1520}}
.studio rect.fr{animation:studio 9.0s infinite}
@keyframes studio{0%,84%,100%{stroke:#2a3647}88%,96%{stroke:#34d399}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
